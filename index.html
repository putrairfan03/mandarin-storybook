<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉卜力风 · 中文故事精选 (Ghibli Storybook)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

  <style>
    :root {
      --ghibli-sky: #8ec5fc;
      --ghibli-meadow: #2d6a4f;
      --paper: #fdfbf7;
      --paper-border: #d8cbb5;
      --text-main: #2b2d42;
      --text-title: #2d5a27;
      --accent-leaf: #52b788;
      --accent-warm: #e07a5f;
      --wood: #8d5b4c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Latar Belakang Alam Semula Jadi Khas Ghibli */
      background: linear-gradient(180deg, #74b9ff 0%, #a8e6cf 55%, #3b7a57 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
      font-family: 'Noto Serif SC', serif;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Awan Gebu Terapung di Latar Belakang */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 250px;
      background: radial-gradient(ellipse at 20% 40%, rgba(255,255,255,0.45) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.4) 0%, transparent 55%),
                  radial-gradient(ellipse at 50% 60%, rgba(255,255,255,0.3) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .top-header {
      text-align: center;
      margin-bottom: 22px;
      position: relative;
      z-index: 2;
    }

    .top-header h1 {
      font-family: 'ZCOOL KuaiLe', 'Ma Shan Zheng', cursive;
      font-size: 2.8rem;
      color: #1b4332;
      letter-spacing: 5px;
      text-shadow: 2px 3px 0px var(--text-title), 0 8px 20px rgba(45, 106, 79, 0.4);
    }

    .top-header p {
      font-size: 1rem;
      color: #2d6a4f;
      margin-top: 6px;
      letter-spacing: 2px;
      font-weight: 600;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    /* PENTAS BUKU 3D */
    .stage {
      perspective: 2200px;
      width: 100%;
      max-width: 980px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .book-container {
      width: 100%;
      min-height: 530px;
      background: var(--paper);
      border-radius: 20px;
      box-shadow: 
        0 22px 50px rgba(18, 53, 36, 0.35),
        0 0 0 4px #ffffff,
        0 0 0 6px var(--paper-border);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    /* PAPARAN DUA HALAMAN BUKU */
    .page-spread {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      width: 100%;
      min-height: 530px;
      background: var(--paper);
      position: relative;
      z-index: 2;
    }

    /* HALAMAN KIRI: ILUSTRASI GHIBLI */
    .page-left {
      padding: 35px 25px 30px 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 75% 50%, #f4fbf7 0%, #edf6f0 100%);
      border-right: 1.5px dashed #cfe3d8;
      position: relative;
    }

    .illustration-frame {
      width: 100%;
      max-width: 330px;
      height: 330px;
      border-radius: 18px;
      overflow: hidden;
      border: 5px solid #ffffff;
      box-shadow: 0 12px 28px rgba(45, 106, 79, 0.22);
      transition: transform 0.35s ease;
      background: #e9ecef;
    }

    .illustration-frame:hover {
      transform: scale(1.02) rotate(-0.5deg);
    }

    .illustration-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .chapter-tag {
      margin-top: 16px;
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: var(--text-title);
      font-family: 'ZCOOL KuaiLe', cursive;
      font-weight: 700;
      background: #e8f5e9;
      padding: 4px 16px;
      border-radius: 20px;
      border: 1px solid #c8e6c9;
    }

    /* HALAMAN KANAN: TEKS CERITA */
    .page-right {
      padding: 38px 45px 30px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--paper);
    }

    .story-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #b7e4c7;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .story-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 2.3rem;
      color: var(--text-title);
      letter-spacing: 2px;
    }

    .btn-audio {
      background: #e8f5e9;
      color: var(--text-title);
      border: 2px solid #a3b18a;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      box-shadow: 0 4px 10px rgba(45, 106, 79, 0.15);
    }

    .btn-audio:hover {
      background: #c8e6c9;
      transform: scale(1.1) rotate(5deg);
    }

    .story-content {
      font-size: 1.2rem;
      line-height: 2.2;
      color: #2b2d42;
      text-align: justify;
      text-justify: inter-ideograph;
      text-indent: 2.4em;
      flex-grow: 1;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .page-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid #e5e5e5;
      font-size: 0.88rem;
      color: #6c757d;
    }

    .page-num {
      font-weight: 700;
      color: var(--text-title);
      background: #eef7ee;
      padding: 3px 12px;
      border-radius: 12px;
    }

    /* HELAIAN FLIPBOOK 3D (OVERLAY SHEET) */
    .flip-sheet {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      background: var(--paper);
      transform-origin: left center;
      z-index: 20;
      pointer-events: none;
      display: none;
      box-shadow: -8px 0 25px rgba(0,0,0,0.22);
    }

    .flip-sheet.anim-forward {
      display: block;
      animation: flipForward 0.65s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
    }

    .flip-sheet.anim-backward {
      display: block;
      left: 0;
      right: auto;
      transform-origin: right center;
      animation: flipBackward 0.65s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
    }

    @keyframes flipForward {
      0% {
        transform: rotateY(0deg);
        filter: brightness(1);
      }
      50% {
        filter: brightness(0.9);
      }
      100% {
        transform: rotateY(-180deg);
        filter: brightness(1);
      }
    }

    @keyframes flipBackward {
      0% {
        transform: rotateY(0deg);
        filter: brightness(1);
      }
      50% {
        filter: brightness(0.9);
      }
      100% {
        transform: rotateY(180deg);
        filter: brightness(1);
      }
    }

    /* BAR KAWALAN BUTANG */
    .controls {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 28px;
      position: relative;
      z-index: 2;
    }

    .nav-btn {
      background: linear-gradient(135deg, #40916c 0%, #1b4332 100%);
      color: #ffffff;
      border: 2px solid #b7e4c7;
      padding: 12px 26px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(27, 67, 50, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(27, 67, 50, 0.5);
      background: linear-gradient(135deg, #52b788 0%, #2d6a4f 100%);
    }

    .nav-btn:disabled {
      background: #6c757d;
      border-color: #adb5bd;
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .page-dots {
      display: flex;
      gap: 9px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      transition: all 0.25s;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .dot.active {
      background: #fdf0d5;
      transform: scale(1.35);
      box-shadow: 0 0 12px #ffffff;
      border-color: #40916c;
    }

    /* RESPONSIF UNTUK TELEFON PINTAR */
    @media (max-width: 800px) {
      .top-header h1 {
        font-size: 2.1rem;
      }
      .page-spread {
        grid-template-columns: 1fr;
      }
      .flip-sheet {
        display: none !important;
      }
      .page-left {
        padding: 24px 20px 10px 20px;
        border-right: none;
        border-bottom: 1.5px dashed #cfe3d8;
      }
      .illustration-frame {
        max-width: 270px;
        height: 190px;
      }
      .page-right {
        padding: 20px 20px 24px 20px;
      }
      .story-title {
        font-size: 1.7rem;
      }
      .story-content {
        font-size: 1.08rem;
        line-height: 2;
      }
    }
  </style>
</head>
<body>

  <div class="top-header">
    <h1>🍃 我们来读书吧！</h1>
    <p>A Storybook Curated By Putra Irfan</p>
  </div>

  <div class="stage">
    <div class="book-container">
      <!-- Muka Surat Sebenar -->
      <div class="page-spread" id="pageSpread">
        <!-- Halaman Kiri (Gambar Bertema Ghibli) -->
        <div class="page-left">
          <div class="illustration-frame">
            <img id="storyImg" src="" alt="Ghibli Story Visual">
          </div>
          <div class="chapter-tag" id="chapterTag">STORY 1</div>
        </div>

        <!-- Halaman Kanan (Teks Cerita Hanzi) -->
        <div class="page-right">
          <div>
            <div class="story-header">
              <h2 class="story-title" id="storyTitle">...</h2>
              <button class="btn-audio" id="audioBtn" title="Dengar sebutan audio">🔊</button>
            </div>
            <p class="story-content" id="storyText">...</p>
          </div>

          <div class="page-footer">
            <span>🌿 纯真与自然的物语</span>
            <span class="page-num" id="pageNum">Page 1 of 10</span>
          </div>
        </div>
      </div>

      <!-- Lapisan Efek Menyelak Kertas 3D -->
      <div class="flip-sheet" id="flipSheet"></div>
    </div>
  </div>

  <!-- Butang Navigasi Selak Halaman -->
  <div class="controls">
    <button class="nav-btn" id="prevBtn">❮ 上一页 (Previous)</button>
    <div class="page-dots" id="dotsContainer"></div>
    <button class="nav-btn" id="nextBtn">下一页 (Next) ❯</button>
  </div>

  <script>
    // 10 Cerita Mandarin dari Google Sheets dengan Gambar Estetik Ghibli Scenery
    const stories = [
      {
        id: 1,
        title: "我的一天",
        // Pemandangan bilik pelajar anime yang tenang dengan tingkap terbuka ke alam menghijau
        image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800",
        text: "我叫大卫，是一名大学生。我每天早上七点起床，先刷牙洗脸，然后去学校食堂吃早饭。我最喜欢吃鸡蛋和包子，喝一杯温牛奶。上午我有两节汉语课，老师教我们读生字和练习写汉字。下午下课后，我常常和同班同学一起在操场打篮球。晚上回到宿舍，我会认真复习当天的生词，听半个小时中文播客。十点半准时上床睡觉，今天又是充实而开心的一天。"
      },
      {
        id: 2,
        title: "周末去超市",
        // Pekan anime dengan deretan kedai buah-buahan segar dan jalan berbatu
        image: "https://images.unsplash.com/photo-1533900298318-6b8da08a523e?q=80&w=800",
        text: "每个星期六下午，王先生都会带全家人一起去家附近的大超市买东西。超市里人很多，货物非常整齐。他们先推着一辆购物车，来到新鲜水果区挑选了五个红苹果、一把香蕉和一个大西瓜。接着，王太太买了晚餐要用的新鲜牛肉和青菜。孩子们挑了两盒巧克力饼干。结账付款的时候，收银员热情地对他们说欢迎下次再来。一家人开开心心地提着大包小包走回家。"
      },
      {
        id: 3,
        title: "可爱的小猫",
        // Kucing comel bersantai di ambang jendela kayu berlatarbelakangkan taman bunga
        image: "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?q=80&w=800",
        text: "李华家里养了一只白色的小猫，名字叫小白。小白长着一对明亮的大眼睛和长长的尾巴，走起路来轻悄悄的。它非常聪明可爱，每天早上只要听到闹钟响，就会跑进房间轻轻拍李华的脸。下午写作业的时候，小白喜欢乖乖躺在桌子旁边晒太阳看书。如果看到老鼠玩具，它就会飞快地扑上去玩很久。有了小白的陪伴，李华的生活充满了许多欢笑与温暖。"
      },
      {
        id: 4,
        title: "图书馆看书",
        // Perpustakaan estetik berkayu dengan cahaya matahari menembusi rak buku (vibe Whisper of the Heart)
        image: "https://images.unsplash.com/photo-1507842229450-7988350ca962?q=80&w=800",
        text: "今天天气晴朗，微风习习。张明吃完午饭就来到了市中心的新图书馆。这里的藏书非常丰富，环境也很安静。进入大门后，张明找到了靠窗户的一张大木桌坐下。他借了一本关于中国历史与传统文化的有趣故事书。窗外阳光正好，洒在整齐的书架上。大家都在安静地自习看书，没有人出声打扰。张明沉浸在精彩的故事里，整整度过了一个充实而宁静的下午。"
      },
      {
        id: 5,
        title: "中国餐馆点菜",
        // Suasana kedai makan tradisional berlampu tanglung hangat (vibe Spirited Away)
        image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=800",
        text: "昨天晚上是林朋的生日，他和几个好朋友相约去一家地道的中国餐馆吃晚餐。服务员很有礼貌地递上精美的菜单，并倒上清香的中国绿茶。林朋点了大家都爱吃的宫保鸡丁、西红柿炒鸡蛋和一碗热腾腾的酸辣汤。上菜速度很快，每一道菜色香味俱全，大家都赞口不绝。大家一边分享美味的佳肴，一边快乐地聊天庆祝。这顿丰盛的生日晚餐让每个人都感到十分幸福。"
      },
      {
        id: 6,
        title: "北京旅行记",
        // Gunung-ganang menghijau berkabus tebal dan laluan puncak yang megah
        image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=800",
        text: "上个月放假的时候，陈红坐了四个小时的高铁去北京旅游。北京是一座既古老又现代化的美丽城市。第一天清晨，她去了天安门广场看庄严的升国旗仪式。第二天，她挑战登上了雄伟壮丽的长城。虽然爬到好汉坡时双腿感到很酸痛，但是站在高处俯瞰群山，风景壮美极了，她感到非常自豪。陈红在旅途中拍下了许多美丽珍贵的照片，并买了好吃的北京烤鸭给家人带回去。"
      },
      {
        id: 7,
        title: "学习做中国菜",
        // Dapur desa yang rustic dan hangat dengan peralatan memasak tradisional

        text: "今天是星期天，小敏决定在厨房向妈妈学习做一道经典的家常菜——西红柿炒鸡蛋。妈妈先教她把两个红红的西红柿洗干净切成均匀的小块，再把三个鸡蛋打进大碗里用力搅拌均匀。接着，在热锅里倒入花生油，先把金黄的鸡蛋炒熟盛出，再把西红柿炒出浓浓的香味，最后加一点盐和白糖混合翻炒。十分钟后，一盘香喷喷的炒菜就出锅了，全家人吃完都夸小敏手艺真棒。"
      },
      {
        id: 8,
        title: "突然下雨的午后",
        // Jalan lorong basah berhujan tenang dengan suasana hijau nostalgia (vibe My Neighbor Totoro)

        text: "周三下午放学的时候，原本晴朗的天空忽然乌云密布，接着刮起了大风，豆大的雨点倾盆而下。很多同学没有带雨伞，只能站在教学楼的走廊下焦急地等待雨停。小明带了一把很大的蓝色雨伞，看到同桌小华正发愁无法回家，便主动走上前邀请小华一起撑伞回家。一路上他们踩着地上的水花，说说笑笑互相照顾，衣服都没有被雨淋湿。相互帮助的友谊让冰冷的雨天变得格外温暖。"
      },
      {
        id: 9,
        title: "医生与健康生活",
        // Rumah kayu damai di lereng bukit menghijau di bawah pokok rendang
        image: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=800",
        text: "王医生是一名经验非常丰富的人民医院医生。他每天要给很多生病的患者看病检查。王医生常常温和地告诉年轻人，拥有健康的身体是人生最重要的财富。如果想要少生病，平时必须养成良好的生活规律：每天要按时吃早饭，尽量少吃高油高糖的外卖食品，坚持每天抽空快走运动半小时，并且坚决不要熬夜。听从王医生的专业建议后，许多病人都逐渐恢复了充沛的体力和精神活力。"

      {
        id: 10,
        title: "四季的美丽",
        // Padang rumput bunga liar di lereng bukit berangin dan awan gebu (vibe Howl's Moving Castle)
        image: "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?q=80&w=800",
        text: "一年有四个美丽的季节，每个季节都有其独特的魅力与风采。春天大地万物复苏，公园里百花齐放，处处生机勃勃。夏天绿树成荫，大家喜欢去海边游泳，享受冰凉甘甜的冰淇淋。秋天是收获的黄金季节，满山的树叶变成金黄与火红，稻田里金浪滚滚。冬天北风呼呼吹过，天空中飘下洁白晶莹的雪花，孩子们欢快地堆雪人打雪仗。这如诗如画的大自然令人无比陶醉。"

    let currentPage = 0;
    let isFlipping = false;

    // Penjana Bunyi Selak Kertas Menggunakan Web Audio API
    let audioCtx = null;
    function playPageFlipSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const bufferSize = audioCtx.sampleRate * 0.28;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, audioCtx.currentTime);
        filter.Q.setValueAtTime(1.2, audioCtx.currentTime);

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.06);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        noise.start();
        noise.stop(audioCtx.currentTime + 0.28);
      } catch (e) {
        // Abaikan jika disekat pelayar
      }
    }

    const storyImg = document.getElementById("storyImg");
    const chapterTag = document.getElementById("chapterTag");
    const storyTitle = document.getElementById("storyTitle");
    const storyText = document.getElementById("storyText");
    const pageNum = document.getElementById("pageNum");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const dotsContainer = document.getElementById("dotsContainer");
    const flipSheet = document.getElementById("flipSheet");
    const audioBtn = document.getElementById("audioBtn");

    // Bina titik navigasi
    stories.forEach((_, idx) => {
      const dot = document.createElement("div");
      dot.className = `dot ${idx === 0 ? 'active' : ''}`;
      dot.addEventListener("click", () => {
        if (!isFlipping && idx !== currentPage) {
          const dir = idx > currentPage ? 'forward' : 'backward';
          flipToPage(idx, dir);
        }
      });
      dotsContainer.appendChild(dot);
    });

    function updateContent(index) {
      currentPage = index;
      const s = stories[index];
      chapterTag.textContent = `STORY ${s.id}`;
      storyTitle.textContent = s.title;
      storyText.textContent = s.text;
      storyImg.src = s.image;
      pageNum.textContent = `Page ${index + 1} of ${stories.length}`;

      prevBtn.disabled = (currentPage === 0);
      nextBtn.disabled = (currentPage === stories.length - 1);

      document.querySelectorAll(".dot").forEach((d, i) => {
        d.classList.toggle("active", i === currentPage);
      });
    }

    // Fungsi Selak Halaman 3D (Page-Flip Effect Berserta Bunyi Kertas)
    function flipToPage(targetIndex, direction) {
      if (isFlipping || targetIndex < 0 || targetIndex >= stories.length) return;
      isFlipping = true;

      playPageFlipSound();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      // Aktifkan animasi helaian berputar
      flipSheet.className = 'flip-sheet ' + (direction === 'forward' ? 'anim-forward' : 'anim-backward');

      // Kemaskini teks semasa helaian berada di kedudukan tegak 90 darjah
      setTimeout(() => {
        updateContent(targetIndex);
      }, 300);

      // Selesai animasi selak
      setTimeout(() => {
        flipSheet.className = 'flip-sheet';
        isFlipping = false;
      }, 650);
    }

    // Suara Audio Sebutan Mandarin
    audioBtn.addEventListener("click", () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cur = stories[currentPage];
        const utterance = new SpeechSynthesisUtterance(cur.title + "。" + cur.text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    });

    nextBtn.addEventListener("click", () => flipToPage(currentPage + 1, 'forward'));
    prevBtn.addEventListener("click", () => flipToPage(currentPage - 1, 'backward'));

    // Papan kekunci (Arrow Left & Right)
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") flipToPage(currentPage + 1, 'forward');
      if (e.key === "ArrowLeft") flipToPage(currentPage - 1, 'backward');
    });

    // Mulakan cerita pertama
    updateContent(0);
  </script>
</body>
</html>
